name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: services/ai-service
        run: pip install -r requirements-dev.txt
      - working-directory: services/ai-service
        run: ruff format --check .
      - working-directory: services/ai-service
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: services/ai-service
        run: pip install -r requirements-dev.txt
      - working-directory: services/ai-service
        run: mypy app/

  test:
    name: Unit tests (offline, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: services/ai-service
        run: pip install -r requirements-dev.txt
      - working-directory: services/ai-service
        run: pytest -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: services/ai-service
        run: pip install -r requirements-dev.txt
      - name: Dependency vulnerability scan (pip-audit)
        working-directory: services/ai-service
        # PYSEC-2026-1325 (ecdsa "Minerva" timing attack) is a transitive dependency of
        # python-jose, only exploitable via ECDSA-family JWT algorithms (ES256 etc). This app
        # only ever uses HS256 (HMAC, no ECDSA involved) — see JWT_ALGORITHM in .env.example —
        # so the vulnerable code path is unreachable. The ecdsa maintainers have declined to fix
        # it (declared out of scope for the project). Documented and explicitly accepted here,
        # not silently ignored.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
      - name: Static security scan (bandit)
        working-directory: services/ai-service
        run: bandit -r app/ scripts/ -ll

  build-and-verify:
    name: Build image + live stack verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: |
          cp services/ai-service/.env.example services/ai-service/.env
          sed -i "s#JWT_SECRET=.*#JWT_SECRET=$(openssl rand -hex 32)#" services/ai-service/.env

      - name: Build image and start the stack
        run: |
          docker compose --env-file services/ai-service/.env \
            -f infrastructure/compose/docker-compose.yml up --build -d api postgres redis minio

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose -f infrastructure/compose/docker-compose.yml logs api
          exit 1

      - name: Run database migrations
        run: docker compose -f infrastructure/compose/docker-compose.yml exec -T api alembic upgrade head

      - name: Run AI evaluation harness
        # Gates the pipeline the same way docs/architecture/phase5.md describes: New Change ->
        # Run Evaluation -> Compare Baseline -> Pass Threshold? A failed or regressed run exits
        # non-zero here and fails the workflow before anything gets built further.
        run: docker compose -f infrastructure/compose/docker-compose.yml exec -T api python scripts/run_evaluations.py

      - name: Smoke test (register -> chat)
        run: |
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"tenant_name":"CI Smoke Test","email":"ci@krixil.internal","password":"correct-horse-battery"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST http://localhost:8000/api/v1/chat \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"message":"hello from CI"}' | grep -q '"model":"mock"'

      - name: Tear down
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v

  # Deploy Staging / Production are deliberately not automated here — there is no real staging
  # or production target to deploy to yet (see docs/architecture/phase5.md). Wiring those in is a
  # config change (target host/registry secrets + a deploy step), not a design change, once that
  # infrastructure exists — everything up to "the image builds and the whole stack works
  # end-to-end" is already verified above on every push.
