# Single source of truth for credentials is services/ai-service/.env. Compose only
# auto-loads a .env next to this file, not that one, so every `docker compose` invocation
# against this file must pass --env-file ../../services/ai-service/.env (see README) —
# otherwise postgres/minio bootstrap with the defaults below while the api container (which
# gets the same file via env_file:, below) could end up with different credentials.
name: krixil

services:
  api:
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/ai-service/.env
    environment:
      # .env is written for host-machine dev (localhost); inside the Docker network the api
      # container must reach the other containers by service name instead.
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      OTEL_EXPORTER_ENDPOINT: http://jaeger:4318/v1/traces
      SANDBOX_RUNNER_URL: http://sandbox-runner:8001
      WORKSPACE_ROOT: /workspaces
      # Hermes Agent Engine runtime (app/agents/hermes_client.py) — only takes effect if a real
      # `hermes` service is actually running at this address (see the commented-out service
      # block below); empty/unreachable just means runtime="hermes" requests get a clear 400
      # instead of a fabricated success. Port 8642 is Hermes's own documented API_SERVER_PORT
      # default.
      HERMES_BASE_URL: http://hermes:8642
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  sandbox-runner:
    build:
      context: ../../services/sandbox-runner
      dockerfile: Dockerfile
    environment:
      WORKSPACE_ROOT: /workspaces
    ports:
      - "8001:8001"
    volumes:
      # This is the ONLY service with Docker socket access in this stack — see
      # docs/architecture/coding-agent.md. Never add this mount to the api service.
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
    restart: unless-stopped

  # Not a real running service — profiles: [build-only] keeps it out of `docker compose up`
  # entirely. Builds the image sandbox-runner's ephemeral run containers actually use
  # (RUNNER_IMAGE in services/sandbox-runner/app/main.py), separate from sandbox-runner's own
  # image above. Build/rebuild with: docker compose --profile build-only build sandbox-runner-image
  sandbox-runner-image:
    build:
      context: ../../services/sandbox-runner/runner-image
      dockerfile: Dockerfile
    image: krixil-sandbox-python:latest
    profiles: ["build-only"]

  # hermes:
  #   Not started by default — this repo doesn't vendor a Hermes checkout (see
  #   docs/architecture/hermes-runtime.md), and its pyproject.toml exact-pins pydantic/httpx
  #   versions that directly conflict with the api service's own pins, which is exactly why it
  #   runs as its own separate container reached over its real HTTP+SSE API rather than being
  #   imported into services/ai-service. Uncomment and point `context:` at a real Hermes checkout
  #   once you have one, with a real API_SERVER_KEY set to match HERMES_API_KEY above:
  #   build:
  #     context: <path-to-a-real-hermes-agent-checkout>
  #     dockerfile: Dockerfile
  #   environment:
  #     API_SERVER_ENABLED: "true"
  #     API_SERVER_HOST: "0.0.0.0"
  #     API_SERVER_PORT: "8642"
  #     API_SERVER_KEY: ${HERMES_API_KEY}
  #   ports:
  #     - "8642:8642"
  #   restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krixil}
      POSTGRES_USER: ${POSTGRES_USER:-krixil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krixil} -d ${POSTGRES_DB:-krixil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The minio/minio image doesn't bundle the `mc` client — use the server's own built-in
      # health endpoint instead (documented at min.io/docs/minio/container).
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP receiver
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  workspaces:
