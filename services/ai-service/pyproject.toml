[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiomatic pattern is `param: X = Depends(...)` — bugbear's B008 exists to catch
# accidental mutable-default footguns, not this. See fastapi.tiangolo.com/tutorial/dependencies.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Body", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
